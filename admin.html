<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — NAAS ID Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">🛠️</div>
      <div>
        <div class="brand-name">NAAS ID Portal</div>
        <div class="brand-sub">Admin Panel</div>
      </div>
    </div>
    <button class="link-btn" onclick="location.href='index.html'">← Home</button>
  </div>

  <!-- LOGIN -->
  <div id="loginView" class="card center-card">
    <h1>Admin Login</h1>
    <p class="lead">Enter the Admin Panel password (set in the Sheet via NAAS ▸ "Set ID Portal Admin Password").</p>
    <label>Password</label>
    <input type="password" id="adminKeyInput" placeholder="••••••••">
    <button class="btn secondary" id="adminLoginBtn" onclick="adminLogin()">Login</button>
    <div class="error-box" id="adminLoginError"></div>
  </div>

  <!-- MAIN PANEL -->
  <div id="panelView" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <h2 style="margin:0;">Students</h2>
        <button class="link-btn" onclick="adminLogout()">Logout</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
        <input type="search" id="searchInput" placeholder="Search by name or Student ID..." style="flex:1;min-width:220px;" oninput="debouncedSearch()">
        <select id="typeFilter" onchange="runSearch()" style="border-radius:12px;border:1.5px solid var(--border);padding:0 14px;font-size:14px;">
          <option value="all">All Students</option>
          <option value="course">Course Students</option>
          <option value="class">Class Students</option>
        </select>
      </div>
      <div id="resultCount" class="hint" style="text-align:left;margin-top:10px;"></div>
      <div id="listHost" style="margin-top:6px;max-height:480px;overflow:auto;"></div>
    </div>
  </div>

  <!-- STUDENT DETAIL MODAL -->
  <div id="detailOverlay" style="display:none;position:fixed;inset:0;background:rgba(14,17,19,0.55);z-index:50;align-items:center;justify-content:center;padding:20px;">
    <div class="card" style="max-width:900px;width:100%;max-height:88vh;overflow:auto;position:relative;">
      <button class="link-btn" style="position:absolute;top:20px;right:24px;" onclick="closeDetail()">✕ Close</button>
      <div id="detailBody"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="idcard.js"></script>
<script>
let adminKey = '';
let searchTimer = null;

async function adminLogin(){
  const key = document.getElementById('adminKeyInput').value.trim();
  const errBox = document.getElementById('adminLoginError');
  const btn = document.getElementById('adminLoginBtn');
  errBox.classList.remove('show');
  if (!key){ errBox.textContent = 'Enter the password.'; errBox.classList.add('show'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Checking...';
  try {
    await apiAdminList(key, 'all', '__ping__'); // cheap way to validate the key (empty result is fine)
    adminKey = key;
    sessionStorage.setItem('naas_admin_key', key);
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('panelView').style.display = 'block';
    runSearch();
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Login';
  }
}

function adminLogout(){
  sessionStorage.removeItem('naas_admin_key');
  location.reload();
}

function debouncedSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 300);
}

async function runSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const type = document.getElementById('typeFilter').value;
  const host = document.getElementById('listHost');
  host.innerHTML = '<p class="hint">Loading...</p>';
  try {
    const data = await apiAdminList(adminKey, type, q);
    document.getElementById('resultCount').textContent = data.count + ' student(s) found.';
    if (!data.students.length){ host.innerHTML = '<p class="hint">No students match.</p>'; return; }
    host.innerHTML = data.students.map(function(s){
      const avatar = s.photoUrl || ('https://ui-avatars.com/api/?background=E7F7EF&color=0E9257&size=64&name=' + encodeURIComponent(s.name));
      return '<div class="list-row" onclick="openDetail(\''+s.id+'\')">' +
        '<div class="li-left">' +
          '<img class="list-avatar" src="'+avatar+'">' +
          '<div><div class="list-name">'+escapeHtml(s.name)+'</div><div class="list-sub">'+s.id+' · '+escapeHtml(s.instance)+'</div></div>' +
        '</div>' +
        '<span class="badge '+s.type+'">'+(s.type==='class'?'CLASS':'COURSE')+'</span>' +
      '</div>';
    }).join('');
  } catch (e) {
    host.innerHTML = '<p class="hint">Error: ' + e.message + '</p>';
  }
}

async function openDetail(id){
  const overlay = document.getElementById('detailOverlay');
  const body = document.getElementById('detailBody');
  overlay.style.display = 'flex';
  body.innerHTML = '<p class="hint">Loading...</p>';
  try {
    const data = await apiAdminStudent(adminKey, id);
    renderDetail(data.profile);
  } catch (e) {
    body.innerHTML = '<p class="hint">Error: ' + e.message + '</p>';
  }
}
function closeDetail(){ document.getElementById('detailOverlay').style.display = 'none'; }

function renderDetail(p){
  const body = document.getElementById('detailBody');
  let statsHtml = '';
  if (p.attendancePct !== null && p.attendancePct !== undefined && p.attendancePct !== ''){
    statsHtml += statTile('Attendance', Math.round(p.attendancePct*100) + '%', '');
  }
  if (p.type === 'class'){
    statsHtml += statTile('Outstanding', money(p.totalOutstanding), p.totalOutstanding > 0 ? 'danger':'');
    statsHtml += statTile('Fee/Month', money(p.feeDefaultPerMonth), '');
  } else {
    statsHtml += statTile('Balance', money(p.balance), p.balance > 0 ? 'danger':'');
    statsHtml += statTile('Status', p.feeStatus||'—', (p.feeStatus==='Pending'||p.feeStatus==='Overdue') ? 'warn':'');
  }

  body.innerHTML =
    '<div class="profile-header">' +
      '<img class="avatar" src="'+(p.photoUrl || ('https://ui-avatars.com/api/?background=E7F7EF&color=0E9257&name=' + encodeURIComponent(p.name)))+'">' +
      '<div><div class="profile-name">'+escapeHtml(p.name)+'</div>' +
      '<div class="profile-meta">'+p.id+' · '+escapeHtml(p.group)+(p.instance?' · '+escapeHtml(p.instance):'')+'</div>' +
      '<span class="badge '+p.type+'" style="margin-top:6px;">'+(p.type==='class'?'CLASS STUDENT':'COURSE STUDENT')+'</span></div>' +
    '</div>' +
    '<div class="stat-grid">'+statsHtml+'</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;">' +
      '<div>' +
        '<div class="section-title" style="margin-top:0;">Contact</div>' +
        detailRow('Parent/Guardian', p.parent) + detailRow('Phone', p.phone) + detailRow('WhatsApp', p.whatsapp) +
        detailRow('Email', p.email) + detailRow('Address', p.address) +
        '<div class="section-title">Other</div>' +
        detailRow('Gender', p.gender) + detailRow('DOB', p.dob) + detailRow('Join Date', p.joinDate) +
        detailRow('Progress', p.progress) + detailRow('Certificate', p.certificate) +
      '</div>' +
      '<div style="text-align:center;">' +
        '<div class="section-title" style="margin-top:0;text-align:left;">ID Card</div>' +
        '<div id="adminCardHost"></div>' +
        '<button class="btn secondary" style="max-width:280px;margin:14px auto 0;" onclick="downloadIdCardPng(\''+p.id+'\')">⬇ Download ID Card (PNG)</button>' +
      '</div>' +
    '</div>';

  renderIdCard(document.getElementById('adminCardHost'), p);
}
function detailRow(label, val){
  return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);">' +
    '<span style="color:var(--grey);">'+label+'</span><span style="font-weight:600;">'+escapeHtml(val || '—')+'</span></div>';
}
function statTile(label, value, extraClass){
  return '<div class="stat-tile '+(extraClass||'')+'"><div class="num">'+value+'</div><div class="lbl">'+label+'</div></div>';
}

// restore session
(function(){
  const saved = sessionStorage.getItem('naas_admin_key');
  if (saved){
    adminKey = saved;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('panelView').style.display = 'block';
    runSearch();
  }
})();
</script>
</body>
</html>
